name: shartflix
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_svg: ^2.2.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.0
  provider: ^6.1.5+1
  image_cropper: ^9.1.0
  image_picker: ^1.2.0
  lottie: ^3.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  flutter_lints: ^6.0.0
  flutter_gen: ^5.11.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true 
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: EuclidCircularA
      fonts:
        - asset: assets/fonts/Euclid Circular A Regular.ttf
        - asset: assets/fonts/Euclid Circular A Bold.ttf
          weight: 700
        - asset: assets/fonts/Euclid Circular A SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Euclid Circular A Medium.ttf
          weight: 500
        - asset: assets/fonts/Euclid Circular A Light.ttf
          weight: 300
        - asset: assets/fonts/Euclid Circular A Italic.ttf
          style: italic
        - asset: assets/fonts/Euclid Circular A Bold Italic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Euclid Circular A Medium Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Euclid Circular A Light Italic.ttf
          weight: 300
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600

flutter_gen:
  line_length: 120
  assets:
    outputs:
      class_name: Assets

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/sinflix_logo.png"
  min_sdk_android: 21 